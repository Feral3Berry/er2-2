name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --uac-admin --name WindowHider window_hider.py
      - uses: actions/upload-artifact@v4
        with:
          name: WindowHider-exe
          path: dist/WindowHider.exe
